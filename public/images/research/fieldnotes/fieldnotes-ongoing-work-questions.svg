<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Beyond the Assistant — Six design questions</title><desc id="desc">Six questions for ongoing AI work: continuity asks what remains recognizable; initiative asks what can begin or interrupt; authority identifies the exact decision; correction responds to new information; return surfaces changes and needed judgment; outcome asks what proves the result and how it can be repaired.</desc><rect width="1600" height="1100" fill="#f5f4ee"/><circle cx="92" cy="84" r="4" fill="#c7472d"/><text x="108" y="90" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">BEYOND THE ASSISTANT / FIELDNOTES</text><text x="88" y="196" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="400">Design for work that continues.</text><text x="88" y="260" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400">Six questions to make an ongoing AI experience understandable.</text><rect x="88" y="330" width="450" height="295" rx="10" fill="#edf0df" stroke="#d7dacd"/><text x="116" y="374" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">01</text><text x="116" y="440" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400">Continuity</text><text x="116" y="501" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">What should the user</text><text x="116" y="537" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">recognize tomorrow?</text><rect x="575" y="330" width="450" height="295" rx="10" fill="#fffef9" stroke="#d7dacd"/><text x="603" y="374" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">02</text><text x="603" y="440" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400">Initiative</text><text x="603" y="501" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">What earns the right</text><text x="603" y="537" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">to begin or interrupt?</text><rect x="1062" y="330" width="450" height="295" rx="10" fill="#fffef9" stroke="#d7dacd"/><text x="1090" y="374" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">03</text><text x="1090" y="440" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400">Authority</text><text x="1090" y="501" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">Which exact action</text><text x="1090" y="537" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">is the person deciding?</text><rect x="88" y="660" width="450" height="295" rx="10" fill="#fffef9" stroke="#d7dacd"/><text x="116" y="704" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">04</text><text x="116" y="770" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400">Correction</text><text x="116" y="831" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">How does new information</text><text x="116" y="867" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">change the proposed work?</text><rect x="575" y="660" width="450" height="295" rx="10" fill="#edf0df" stroke="#d7dacd"/><text x="603" y="704" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">05</text><text x="603" y="770" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400">Return</text><text x="603" y="831" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">What changed and what</text><text x="603" y="867" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">needs judgment now?</text><rect x="1062" y="660" width="450" height="295" rx="10" fill="#fffef9" stroke="#d7dacd"/><text x="1090" y="704" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">06</text><text x="1090" y="770" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400">Outcome</text><text x="1090" y="831" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">What proves the action’s</text><text x="1090" y="867" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">result, and how can it</text><text x="1090" y="903" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">be repaired?</text><text x="88" y="1042" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Original editorial research model · Fieldnotes 0.4</text><text x="1175" y="1042" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">OCTOBER 2026</text></svg>