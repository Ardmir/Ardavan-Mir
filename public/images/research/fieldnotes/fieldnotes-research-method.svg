<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Fieldnotes research method — Keep the reasoning visible</title><desc id="desc">Three connected parts of the research method: observe the exact source and its limits; interpret the design choice and compare alternatives; apply it to a task with explicit adaptations and open questions. Evidence stays attached to the decision.</desc><rect width="1600" height="1000" fill="#f5f4ee"/><circle cx="92" cy="84" r="4" fill="#c7472d"/><text x="108" y="90" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">METHOD / FIELDNOTES</text><text x="88" y="196" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="400">Keep the reasoning visible.</text><text x="88" y="260" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400">Source observations, interpretations and design decisions remain distinct.</text><rect x="88" y="330" width="440" height="435" rx="10" fill="#fffef9" stroke="#d7dacd"/><text x="118" y="374" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">01 / EVIDENCE</text><text x="118" y="433" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400">Observe the source</text><path d="M118 466H498" fill="none" stroke="#d7dacd" stroke-width="1"/><text x="118" y="513" fill="#22251f" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" font-style="italic">What can we actually see?</text><text x="118" y="590" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Inspect the exact state.</text><text x="118" y="639" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Retain its source and date.</text><text x="118" y="688" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Record what it cannot prove.</text><rect x="580" y="330" width="440" height="435" rx="10" fill="#edf0df" stroke="#d7dacd"/><text x="610" y="374" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">02 / SYNTHESIS</text><text x="610" y="433" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400">Interpret the choice</text><path d="M610 466H990" fill="none" stroke="#d7dacd" stroke-width="1"/><text x="610" y="513" fill="#22251f" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" font-style="italic">Why might this approach fit?</text><text x="610" y="590" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Name the design mechanism.</text><text x="610" y="639" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Compare a relevant alternative.</text><text x="610" y="688" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Keep tradeoffs and uncertainty.</text><rect x="1072" y="330" width="440" height="435" rx="10" fill="#fffef9" stroke="#d7dacd"/><text x="1102" y="374" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">03 / DESIGN DECISION</text><text x="1102" y="433" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400">Apply with judgment</text><path d="M1102 466H1482" fill="none" stroke="#d7dacd" stroke-width="1"/><text x="1102" y="513" fill="#22251f" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" font-style="italic">What changes in my context?</text><text x="1102" y="590" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Choose a fit for the task.</text><text x="1102" y="639" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Make the adaptation explicit.</text><text x="1102" y="688" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Carry open questions forward.</text><path d="M542 549h20m-8-8 8 8-8 8" fill="none" stroke="#62665b" stroke-width="2"/><path d="M1034 549h20m-8-8 8 8-8 8" fill="none" stroke="#62665b" stroke-width="2"/><text x="88" y="843" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">THE EVIDENCE STAYS WITH THE DECISION</text><text x="88" y="899" fill="#22251f" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">The original source, uncertainty and open questions travel with the brief.</text><text x="88" y="960" fill="#62665b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Original research-method diagram · Fieldnotes 0.4</text></svg>